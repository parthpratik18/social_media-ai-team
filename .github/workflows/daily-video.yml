name: Daily AI Content Team

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Content channel
        type: choice
        required: true
        default: dil-se-scroll
        options: [dil-se-scroll, codersadda, divine-path]
      topic:
        description: Optional topic (leave blank for AI-selected evergreen idea)
        type: string
        required: false
      visuals:
        description: Footage mode
        type: choice
        required: true
        default: cards
        options: [cards, stock, ai-images]

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run AI content team and render video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_IMAGE_MODEL: ${{ vars.HF_IMAGE_MODEL }}
          CHANNEL: ${{ inputs.channel }}
          TOPIC: ${{ inputs.topic }}
          VISUAL_MODE: ${{ inputs.visuals }}
        run: python scripts/run_video.py
      - name: Upload generated package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-package-${{ inputs.channel }}-${{ github.run_number }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 7
